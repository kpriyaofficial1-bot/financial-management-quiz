<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 7</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 7</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "The finance manager is primarily concerned with:", "opts": ["Acquisition and effective use of funds", "Only employee attendance", "Only advertising", "Only production"], "ans": "A"}, {"q": "A positive net present value generally indicates that a project:", "opts": ["Adds value at the required return", "Destroys value", "Has zero cash flows", "Must be rejected"], "ans": "A"}, {"q": "Compounding means:", "opts": ["Earning interest on previously earned interest", "Ignoring interest", "Reducing principal every period", "Paying dividends only"], "ans": "A"}, {"q": "Expected return is:", "opts": ["The weighted average of possible returns using probabilities", "Always equal to risk", "Always zero", "Only the highest return"], "ans": "A"}, {"q": "Beta measures a security's sensitivity to:", "opts": ["Market movements", "Inventory changes", "Tax rates", "Production volume only"], "ans": "A"}, {"q": "A higher credit rating generally indicates:", "opts": ["Lower perceived default risk", "Higher inventory", "Lower sales", "Higher operating leverage"], "ans": "A"}, {"q": "Capital structure decision concerns the mix of:", "opts": ["Debt and equity financing", "Cash and inventory", "Sales and purchases", "Fixed and variable costs only"], "ans": "A"}, {"q": "If fixed financial charges increase, financial leverage generally:", "opts": ["Increases", "Decreases to zero", "Remains unchanged always", "Becomes negative"], "ans": "A"}, {"q": "The operating cycle represents the time between:", "opts": ["Acquisition of inventory and collection of cash from sales", "Payment of dividends and taxes", "Issue and redemption of shares", "Purchase and sale of fixed assets"], "ans": "A"}, {"q": "A high inventory turnover ratio generally indicates:", "opts": ["Faster movement of inventory", "Slow inventory movement", "No sales", "Excessive receivables"], "ans": "A"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
