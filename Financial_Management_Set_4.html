<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 4</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 4</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "Modern financial management primarily emphasizes:", "opts": ["Wealth maximization and value creation", "Maximum production only", "Minimum sales", "Maximum inventory"], "ans": "A"}, {"q": "Which is a major finance function?", "opts": ["Investment decision", "Personnel recruitment", "Production scheduling", "Advertising design"], "ans": "A"}, {"q": "Present value is obtained by:", "opts": ["Compounding a future amount", "Discounting a future amount", "Adding interest to sales", "Multiplying profit by assets"], "ans": "B"}, {"q": "When a bond is sold below its face value, its yield to maturity is generally:", "opts": ["Lower than coupon rate", "Higher than coupon rate", "Always zero", "Equal to the tax rate"], "ans": "B"}, {"q": "The after-tax cost of debt is generally lower than its before-tax cost because of:", "opts": ["Interest tax shield", "Dividend tax", "Higher sales", "Inventory turnover"], "ans": "A"}, {"q": "According to MM theory without taxes, firm value is:", "opts": ["Dependent only on debt", "Independent of capital structure", "Always zero", "Determined only by dividends"], "ans": "B"}, {"q": "Degree of financial leverage measures the sensitivity of:", "opts": ["EPS to changes in EBIT", "Sales to inventory", "Assets to cash", "Tax to revenue"], "ans": "A"}, {"q": "High fixed operating costs generally result in:", "opts": ["Higher operating leverage", "Lower operating leverage", "No operating leverage", "Negative working capital"], "ans": "A"}, {"q": "The maximum inventory level is maintained mainly to:", "opts": ["Prevent stock from exceeding the desired upper limit", "Increase ordering costs", "Eliminate purchases", "Increase receivables"], "ans": "A"}, {"q": "An increase in ordering cost, other things equal, causes EOQ to:", "opts": ["Decrease", "Increase", "Remain zero", "Become negative"], "ans": "B"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
