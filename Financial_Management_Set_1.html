<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 1</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 1</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "Which objective of financial management focuses on increasing the market value of owners' investment?", "opts": ["Profit maximization", "Cost minimization", "Wealth maximization", "Sales maximization"], "ans": "C"}, {"q": "Which decision determines where the firm's funds should be invested?", "opts": ["Financing decision", "Dividend decision", "Investment decision", "Working capital decision"], "ans": "C"}, {"q": "What is the present value of ₹10,000 due one year from now at 10%?", "opts": ["₹9,000", "₹9,090.91", "₹10,100", "₹11,000"], "ans": "B"}, {"q": "What is the return required by ordinary shareholders called?", "opts": ["Cost of debt", "Cost of preference capital", "Cost of equity", "Cost of retained earnings"], "ans": "C"}, {"q": "A debenture carries interest of ₹12 per ₹100 issued at par. Ignoring tax, its cost is:", "opts": ["10%", "11%", "12%", "14%"], "ans": "C"}, {"q": "Under the Net Income approach, an increase in debt generally:", "opts": ["Increases overall cost of capital", "Has no effect on firm value", "Reduces overall cost of capital and increases firm value", "Eliminates financial risk"], "ans": "C"}, {"q": "Operating leverage arises mainly because of:", "opts": ["Fixed operating costs", "Variable costs", "Interest expenses", "Dividend payments"], "ans": "A"}, {"q": "Which working-capital technique manages cash inflows and outflows?", "opts": ["Cash management", "Inventory management", "Receivables management", "Capital budgeting"], "ans": "A"}, {"q": "EOQ primarily aims to:", "opts": ["Maximize inventory", "Minimize ordering and carrying costs", "Maximize sales", "Eliminate safety stock"], "ans": "B"}, {"q": "If annual demand is 4,800 units, ordering cost is ₹50 and carrying cost is ₹2 per unit, EOQ is approximately:", "opts": ["300 units", "400 units", "490 units", "600 units"], "ans": "C"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
