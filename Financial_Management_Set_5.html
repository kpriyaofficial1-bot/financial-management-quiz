<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 5</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 5</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "Which decision determines the composition of a firm's assets?", "opts": ["Investment decision", "Dividend decision", "Recruitment decision", "Production decision"], "ans": "A"}, {"q": "The primary purpose of financial planning is to:", "opts": ["Ensure adequate funds are available when required", "Eliminate all expenses", "Avoid budgeting", "Maximize inventory"], "ans": "A"}, {"q": "If ₹10,000 is invested at 10% simple interest for 3 years, the maturity value is:", "opts": ["₹11,000", "₹12,000", "₹13,000", "₹14,000"], "ans": "C"}, {"q": "The risk-free rate represents:", "opts": ["Return with no or negligible default risk", "Maximum business risk", "Cost of inventory", "Cost of equity only"], "ans": "A"}, {"q": "Systematic risk is:", "opts": ["Diversifiable risk", "Market-related risk that cannot be eliminated through diversification", "Only production risk", "Only liquidity risk"], "ans": "B"}, {"q": "WACC stands for:", "opts": ["Weighted Average Cost of Capital", "Working Asset Cost Calculation", "Weighted Asset Current Cost", "Working Average Capital Cost"], "ans": "A"}, {"q": "A firm's capital structure consists primarily of:", "opts": ["Long-term sources of finance", "Only cash", "Only inventory", "Only current liabilities"], "ans": "A"}, {"q": "Financial leverage is favourable when:", "opts": ["Return on investment exceeds the cost of debt", "Debt cost exceeds return on investment", "EBIT is zero", "Sales are zero"], "ans": "A"}, {"q": "The main objective of cash management is to:", "opts": ["Maintain adequate liquidity while avoiding idle cash", "Hold maximum cash", "Eliminate bank accounts", "Avoid collections"], "ans": "A"}, {"q": "Credit standards determine:", "opts": ["Which customers are eligible for credit", "The EOQ formula", "The tax rate", "The depreciation method"], "ans": "A"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
