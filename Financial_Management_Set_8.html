<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 8</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 8</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "Agency problems arise mainly because:", "opts": ["Managers and owners may have different interests", "All shareholders are managers", "Debt has no cost", "Markets are closed"], "ans": "A"}, {"q": "A finance manager's investment decision is also called:", "opts": ["Capital budgeting decision", "Dividend decision", "Credit decision", "Personnel decision"], "ans": "A"}, {"q": "A perpetuity is an annuity that:", "opts": ["Continues indefinitely", "Lasts one year", "Has unequal payments only", "Has no cash flows"], "ans": "A"}, {"q": "The present value factor is:", "opts": ["Less than 1 for a positive discount rate and future cash flow", "Always greater than 1", "Always zero", "Equal to the tax rate"], "ans": "A"}, {"q": "Standard deviation is a measure of:", "opts": ["Dispersion of returns", "Dividend payout only", "Liquidity only", "Debt ratio only"], "ans": "A"}, {"q": "Cost of debt is usually adjusted for:", "opts": ["Tax benefit of interest", "Inventory loss", "Sales commission", "Depreciation only"], "ans": "A"}, {"q": "A higher proportion of debt can increase:", "opts": ["Financial risk", "Cash sales", "Inventory quality", "Market liquidity"], "ans": "A"}, {"q": "Combined leverage is useful for studying the effect of sales changes on:", "opts": ["EPS", "Inventory", "Cash balance only", "Tax rate"], "ans": "A"}, {"q": "Working capital is commonly defined as:", "opts": ["Current assets minus current liabilities", "Fixed assets minus debt", "Sales minus profit", "Equity minus cash"], "ans": "A"}, {"q": "A liberal credit policy generally tends to:", "opts": ["Increase sales and receivables investment", "Eliminate receivables", "Reduce all credit sales", "Eliminate collection costs"], "ans": "A"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
