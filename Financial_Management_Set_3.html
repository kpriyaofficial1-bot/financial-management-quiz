<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 3</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 3</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "Which financial decision deals with distributing profits to shareholders?", "opts": ["Investment decision", "Financing decision", "Dividend decision", "Working capital decision"], "ans": "C"}, {"q": "Risk in finance is commonly associated with:", "opts": ["Certainty of return", "Variability or uncertainty of expected returns", "Only high profits", "Only business losses"], "ans": "B"}, {"q": "What is the future value of ₹5,000 invested at 8% compounded annually for 2 years?", "opts": ["₹5,400", "₹5,800", "₹5,832", "₹6,000"], "ans": "C"}, {"q": "An implicit cost is best described as:", "opts": ["A cash expense paid to outsiders", "An opportunity or imputed cost", "A statutory tax", "A fixed asset cost"], "ans": "B"}, {"q": "The cost of retained earnings is related to:", "opts": ["The return shareholders could earn on comparable investments", "The firm's tax rate only", "The coupon rate on debt", "The face value of shares"], "ans": "A"}, {"q": "The Traditional approach to capital structure suggests that:", "opts": ["An optimum capital structure can exist", "Debt has no cost", "Equity is always cheaper than debt", "Capital structure never affects value"], "ans": "A"}, {"q": "Combined leverage is the combination of:", "opts": ["Operating and financial leverage", "Financial and liquidity ratios", "Current and fixed assets", "Debt and dividend ratios"], "ans": "A"}, {"q": "High operating leverage means:", "opts": ["Small sales changes can cause large changes in EBIT", "Interest expense is zero", "Fixed costs are zero", "EPS never changes"], "ans": "A"}, {"q": "ABC analysis classifies inventory mainly according to:", "opts": ["Annual consumption value and relative importance", "Physical size", "Supplier location", "Colour"], "ans": "A"}, {"q": "Safety stock is maintained mainly to protect against:", "opts": ["Uncertainty in demand or lead time", "Higher selling prices", "Lower wages", "Tax changes"], "ans": "A"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
