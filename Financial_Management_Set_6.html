<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Management — Set 6</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#222}
.card{max-width:800px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:25px;margin-top:0} .meta{display:grid;gap:10px;margin-bottom:20px}
input[type=text]{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.q{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:12px}
.opt{display:block;padding:10px;margin:7px 0;background:#f7f7f7;border-radius:8px;cursor:pointer}
button{background:#1769e0;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
.result{text-align:center;padding:25px;margin-top:20px;background:#eef7ee;border-radius:12px}
.small{color:#666;font-size:13px}
</style></head><body><div class="card">
<h1>Financial Management — Set 6</h1>
<p class="small">10 questions • Automatic scoring • Student result shown immediately</p>
<div class="meta"><input id="name" type="text" placeholder="Student Name">
<input id="roll" type="text" placeholder="Roll Number"></div>
<form id="quiz"></form>
<button onclick="submitQuiz()">Submit Quiz</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const questions=[{"q": "Profit maximization may be criticized because it:", "opts": ["May ignore timing and risk of returns", "Always maximizes wealth", "Considers every risk perfectly", "Uses only market value"], "ans": "A"}, {"q": "Liquidity refers to the ability of a firm to:", "opts": ["Meet short-term obligations", "Maximize long-term debt", "Increase fixed assets only", "Avoid all expenses"], "ans": "A"}, {"q": "The rule of 72 is commonly used to estimate:", "opts": ["Doubling time of an investment", "EOQ", "Reorder level", "Dividend payout"], "ans": "A"}, {"q": "If the required rate of return increases, the present value of a future cash flow generally:", "opts": ["Decreases", "Increases", "Remains unchanged", "Becomes equal to FV"], "ans": "A"}, {"q": "Portfolio diversification primarily reduces:", "opts": ["Unsystematic risk", "Systematic risk completely", "Inflation", "Interest expense"], "ans": "A"}, {"q": "Cost of capital is used as a:", "opts": ["Benchmark rate for investment decisions", "Measure of inventory", "Sales forecast only", "Payroll ratio"], "ans": "A"}, {"q": "Under MM theory with corporate taxes, debt can provide:", "opts": ["A tax advantage through interest deductibility", "No tax effect", "Only operating leverage", "A dividend guarantee"], "ans": "A"}, {"q": "Degree of operating leverage is based on the relationship between:", "opts": ["Contribution and EBIT", "Debt and equity", "Cash and inventory", "Sales and tax"], "ans": "A"}, {"q": "A conservative working-capital policy generally involves:", "opts": ["Higher investment in current assets", "Zero current assets", "No cash balance", "Maximum short-term borrowing"], "ans": "A"}, {"q": "A collection policy that is too strict may:", "opts": ["Reduce sales by discouraging credit customers", "Increase all sales automatically", "Eliminate bad debts completely", "Increase inventory turnover only"], "ans": "A"}];
const letters=["A","B","C","D"];
const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="q";
 d.innerHTML="<b>"+(i+1)+". "+x.q+"</b>";
 x.opts.forEach((o,j)=>{
   d.innerHTML += '<label class="opt"><input type="radio" name="q'+i+'" value="'+letters[j]+'"> '+letters[j]+". "+o+"</label>";
 });
 quiz.appendChild(d);
});
function submitQuiz(){
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name||!roll){alert("Please enter your name and roll number.");return;}
 let score=0;
 for(let i=0;i<questions.length;i++){
   const a=document.querySelector('input[name="q'+i+'"]:checked');
   if(!a){alert("Please answer Question "+(i+1)+".");return;}
   if(a.value===questions[i].ans) score++;
 }
 const pct=Math.round(score/questions.length*100);
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Quiz Submitted</h2><p><b>"+name+"</b> ("+roll+")</p><p style='font-size:28px'><b>"+score+"/10</b></p><p>Percentage: <b>"+pct+"%</b></p><p>Your result has been calculated on this device.</p>";
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
